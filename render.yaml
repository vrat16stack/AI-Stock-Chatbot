# render.yaml
# Paste this in your Render dashboard when deploying the backend.

services:
  - type: web
    name: nse-chatbot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn chatbot_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false      # set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama3-70b-8192
